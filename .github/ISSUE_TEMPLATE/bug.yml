# SPDX-License-Identifier: GPL-2.0-or-later
name: Bug
description: Something in opendectcell does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never attach firmware images, configuration backups or captures with real identities** (IPEI, IPUI, keys, PINs, phone numbers, SIP credentials) to an issue; mask them.
  - type: input
    id: version
    attributes:
      label: opendectcell version, box, OpenWrt version
      placeholder: "0.3.5, FRITZ!Box 7412, OpenWrt 25.12.6"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "`logread -e dect`, personal data removed. Never paste keys, PINs or SIP passwords."
      render: text
