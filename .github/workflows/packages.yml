# SPDX-License-Identifier: GPL-2.0-or-later
# Builds the OpenWrt packages with the official SDK (tools/release/build.sh).
# Run by hand only: a tag does not start it, so a release built on the
# maintainer's machine (tools/release/build.sh and images.sh) does not also cost
# CI minutes. Started by hand from a tag ref it makes a draft release with the
# packages and their checksums; its text is tools/release/notes-<version>.md if
# that exists, else notes.md.
#
# The signing key (secret OPENDECTCELL_SIGN_KEY of the environment "release") is
# used by one job only, "sign", which runs no project build script: the build
# jobs make unsigned packages (the SDK signs them with its own throwaway key),
# and "sign" re-signs the finished files with `apk adbsign` using an `apk`
# downloaded from openwrt.org and checked against its sha256sums. The
# environment has the maintainer as required reviewer and runs on tags only
# (docs/releasing.md).
name: Packages

on:
  workflow_dispatch:
    inputs:
      images:
        description: "also build the flashable images (about 10 more minutes)"
        type: boolean
        default: false

# The token reads the repository and nothing more; the release job asks
# for what it needs itself (security audit 2026-10-29, C1).
permissions:
  contents: read

env:
  # for the release notes; each job sets its own from the matrix
  OPENWRT: 25.12.6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One release for both boxes (maintainer, 2026-11-01). The kernel module
        # only fits the kernel it was built for: a box on an older release
        # takes the userspace packages over apk and the module with the image.
        include:
          - { target: ipq40xx/generic, openwrt: "25.12.6" }
          - { target: lantiq/xrx200, openwrt: "25.12.6" }
    runs-on: ubuntu-24.04
    env:
      OPENWRT: ${{ matrix.openwrt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev zstd file wget

      - name: Slug
        id: slug
        run: echo "name=$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"

      - name: SDK cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/release/*.tar.zst
          key: sdk-${{ matrix.openwrt }}-${{ steps.slug.outputs.name }}

      - name: Build
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        # no secret here: the SDK build runs third-party build scripts
        run: tools/release/build.sh '${{ matrix.target }}' out

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ steps.slug.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

  images:
    # One ImageBuilder run per target with the packages just built. Only on a
    # tag or when asked for: it costs CI minutes.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.images
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ipq40xx/generic, openwrt: "25.12.6" }
          - { target: lantiq/xrx200, openwrt: "25.12.6" }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make gawk python3 file wget zstd rsync unzip \
            tar gettext git bzip2 patch xz-utils

      - name: Slug
        id: slug
        run: echo "name=$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-${{ steps.slug.outputs.name }}
          path: apks

      - name: Image
        env:
          OPENWRT: ${{ matrix.openwrt }}
        run: tools/release/images.sh '${{ matrix.target }}' apks images

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ steps.slug.outputs.name }}
          path: images/*
          if-no-files-found: error

  sign:
    # The only job that sees the signing key. It runs no script of this project's build: the packages are files from
    # the build job, the `apk` is the official one from the OpenWrt SDK (checked against openwrt.org's sha256sums).
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: packages-*
          path: pk
          merge-multiple: true

      - name: apk from the official SDK
        run: |
          base=https://downloads.openwrt.org/releases/$OPENWRT/targets/lantiq/xrx200
          curl -fsSL -o sha256sums "$base/sha256sums"
          line=$(grep -E '\*openwrt-sdk-.*\.tar\.zst$' sha256sums)
          tarball=${line##*\*}
          curl -fL -o "$tarball" "$base/$tarball"
          echo "$line" | sha256sum -c -
          mkdir sdk
          # the SDK's apk is a wrapper around .apk.bin and the libraries beside it
          tar --zstd -xf "$tarball" -C sdk --strip-components=3 --wildcards \
            '*/staging_dir/host/bin/apk' '*/staging_dir/host/bin/.apk.bin' '*/staging_dir/host/lib/*'
          ./sdk/bin/apk --version

      - name: Sign
        env:
          SIGN_KEY_PEM: ${{ secrets.OPENDECTCELL_SIGN_KEY }}
        run: |
          key=$RUNNER_TEMP/sign.pem
          (umask 077; printf '%s\n' "$SIGN_KEY_PEM" > "$key")
          mkdir -p keys
          openssl ec -in "$key" -pubout -out keys/opendectcell.pem 2>/dev/null
          cmp keys/opendectcell.pem openwrt/opendectcell-signing-key.pem ||
            { echo "the secret is not the key of openwrt/opendectcell-signing-key.pem" >&2; rm -f "$key"; exit 1; }
          for f in pk/*.apk; do
            ./sdk/bin/apk adbsign --allow-untrusted --sign-key "$key" --reset-signatures "$f"
          done
          rm -f "$key"
          ./sdk/bin/apk verify --keys-dir "$PWD/keys" pk/*.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-packages
          path: pk/*.apk
          if-no-files-found: error

  release:
    needs: [build, images, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-packages
          path: out

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*
          path: out
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          rm -f SHA256SUMS-*.images
          sha256sum *.apk *sysupgrade* > SHA256SUMS
          notes=../tools/release/notes-${TAG#v}.md
          [ -f "$notes" ] || notes=../tools/release/notes.md
          sed -e "s/{VERSION}/${TAG#v}/g" -e "s/{OPENWRT}/$OPENWRT/g" \
            "$notes" > ../notes.md
          gh release create "$TAG" --draft --verify-tag \
            --title "openDECTcell ${TAG#v}" --notes-file ../notes.md \
            *.apk *sysupgrade* *.manifest SHA256SUMS ../openwrt/opendectcell-signing-key.pem
