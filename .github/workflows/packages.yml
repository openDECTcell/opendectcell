# Builds the OpenWrt packages with the official SDK (tools/release/build.sh).
# Run by hand only (2026-11-03): a tag no longer starts it, so a release built
# on the maintainer's machine (tools/release/build.sh and images.sh, with the
# private kernel-module repositories reachable) does not also cost CI minutes.
# On a tag ref it would make a draft release with the packages and their
# checksums; its text is tools/release/notes-<version>.md if that exists, else notes.md.
name: Packages

on:
  workflow_dispatch:
    inputs:
      images:
        description: "also build the flashable images (about 10 more minutes)"
        type: boolean
        default: false

# The token reads the repository and nothing more; the release job asks
# for what it needs itself (security audit 2026-10-29, C1).
permissions:
  contents: read

env:
  # for the release notes; each job sets its own from the matrix
  OPENWRT: 25.12.6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # One release for both boxes (maintainer, 2026-11-01). The kernel module
        # only fits the kernel it was built for: a box on an older release
        # takes the userspace packages over apk and the module with the image.
        include:
          - { target: ipq40xx/generic, openwrt: "25.12.6" }
          - { target: lantiq/xrx200, openwrt: "25.12.6" }
    runs-on: ubuntu-24.04
    env:
      OPENWRT: ${{ matrix.openwrt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev zstd file wget

      - name: Slug
        id: slug
        run: echo "name=$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"

      - name: SDK cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/release/*.tar.zst
          key: sdk-${{ matrix.openwrt }}-${{ steps.slug.outputs.name }}

      - name: Build
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SIGN_KEY_PEM: ${{ secrets.OPENDECTCELL_SIGN_KEY }}
        run: |
          if [ -n "$SIGN_KEY_PEM" ]; then
            printf '%s\n' "$SIGN_KEY_PEM" > "$RUNNER_TEMP/sign.pem"
            export SIGN_KEY="$RUNNER_TEMP/sign.pem"
          elif [ -n "$TAG" ]; then
            echo "a release needs the signing key (secret OPENDECTCELL_SIGN_KEY)" >&2
            exit 1
          else
            echo "::warning::no signing key: these packages install only with apk add --allow-untrusted"
          fi
          tools/release/build.sh '${{ matrix.target }}' out
          # the private key, and the copy build.sh made, gone before
          # the steps that follow
          rm -f "$RUNNER_TEMP/sign.pem" build/release/*/private-key.pem

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ steps.slug.outputs.name }}
          path: out/*.apk
          if-no-files-found: error

  images:
    # One ImageBuilder run per target with the packages just built. Only on a
    # tag or when asked for: it costs CI minutes.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.images
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ipq40xx/generic, openwrt: "25.12.6" }
          - { target: lantiq/xrx200, openwrt: "25.12.6" }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make gawk python3 file wget zstd rsync unzip \
            tar gettext git bzip2 patch xz-utils

      - name: Slug
        id: slug
        run: echo "name=$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-${{ steps.slug.outputs.name }}
          path: apks

      - name: Image
        env:
          OPENWRT: ${{ matrix.openwrt }}
        run: tools/release/images.sh '${{ matrix.target }}' apks images

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ steps.slug.outputs.name }}
          path: images/*
          if-no-files-found: error

  release:
    needs: [build, images]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd out
          rm -f SHA256SUMS-*.images
          sha256sum *.apk *sysupgrade* > SHA256SUMS
          notes=../tools/release/notes-${TAG#v}.md
          [ -f "$notes" ] || notes=../tools/release/notes.md
          sed -e "s/{VERSION}/${TAG#v}/g" -e "s/{OPENWRT}/$OPENWRT/g" \
            "$notes" > ../notes.md
          gh release create "$TAG" --draft --verify-tag \
            --title "openDECTcell ${TAG#v}" --notes-file ../notes.md \
            *.apk *sysupgrade* *.manifest SHA256SUMS ../openwrt/opendectcell-signing-key.pem
